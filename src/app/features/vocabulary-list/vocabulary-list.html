<section class="vocabulary-list">

    <header class="list-header">
        <h3>Vocabulary List</h3>
        <img src="icons/list.svg" alt="">
    </header>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th scope="col">No.</th>
                    <th scope="col">English</th>
                    <th scope="col">German</th>
                </tr>
            </thead>

            <tbody>
                @for (card of topic().cards; track card.id) {
                <tr>
                    <td class="card-number">
                        {{ ($index + 1).toString().padStart(2, '0') }}
                    </td>

                    <td>
                        <span class="card-front">{{ card.front }}</span>

                        @if (card.explanation) {
                        <p class="explanation">{{ card.explanation }}</p>
                        }
                    </td>

                    <td>
                        <span class="card-back">{{ card.back }}</span>

                        @if (card.example) {
                        <pre class="example"><code>{{ card.example }}</code></pre>
                        }
                    </td>
                </tr>
                }
            </tbody>
        </table>
    </div>

</section>
